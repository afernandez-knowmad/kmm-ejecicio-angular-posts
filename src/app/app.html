<header class="sticky top-0 z-10 border-b border-slate-200 bg-white">
  <div class="mx-auto flex max-w-6xl items-center gap-6 px-6 py-3">
    <a
      class="flex items-center text-slate-900 no-underline"
      routerLink="/posts"
      data-testid="app-brand-link"
    >
      <span class="text-base font-semibold tracking-tight">TechPoC</span>
    </a>

    <div class="flex-1"></div>

    <div class="flex items-center gap-3">
      @if (store.isAuthenticated()) {
        <div class="w-72">
          <app-posts-search />
        </div>
      }
      <ng-content select="[appHeaderActions]" />
      <app-lang-switcher />
      <app-logout-button />
    </div>
  </div>
</header>

<main class="mx-auto w-full max-w-6xl px-6 py-8">
  <router-outlet />
</main>
