<header class="sticky top-0 z-10 border-b border-slate-200 bg-white">
  <div
    class="mx-auto grid max-w-6xl grid-cols-[1fr_auto] items-center gap-3 px-4 py-3 sm:flex sm:gap-6 sm:px-6"
  >
    <!--
      Single DOM copy of each piece, repositioned per viewport via
      `order-*` utilities.

      Mobile (default — grid 2 columns):
        Row 1:   brand (order-1)          |  actions (order-2)
        Row 2:   search (order-3, col-span-2, full width)

      Desktop (sm: — flex row):
        brand (order-1) | search (order-2) | spacer (order-3) | actions (order-4)

      The grid layout is what makes `order-2` for actions sit on
      the same row as the brand on mobile (the algorithm fills the
      1fr/auto columns first, then wraps to a new row). On desktop
      the same source order renders as a single flex row with the
      spacer pushing the actions to the far right.
    -->
    <a
      class="order-1 flex items-center text-slate-900 no-underline"
      routerLink="/posts"
      data-testid="app-brand-link"
    >
      <span class="text-base font-semibold tracking-tight">TechPoC</span>
    </a>

    <div class="order-2 flex items-center gap-3 sm:order-4" data-testid="app-header-actions">
      <ng-content select="[appHeaderActions]" />
      <app-lang-switcher />
      <app-logout-button />
    </div>

    @if (showSearch()) {
      <div class="order-3 col-span-2 w-full sm:order-3 sm:col-span-1 sm:w-72">
        <app-posts-search />
      </div>
    }

    <div class="hidden sm:order-2 sm:block sm:flex-1"></div>
  </div>
</header>

<main class="mx-auto w-full max-w-6xl px-4 py-6 sm:px-6 sm:py-8">
  <router-outlet />
</main>
