<header class="app-header">
  <div class="app-header__inner">
    <a class="app-header__brand" routerLink="/">
      <span class="app-header__brand-title">{{ 'app.title' | transloco }}</span>
      <span class="app-header__brand-tagline">{{ 'app.tagline' | transloco }}</span>
    </a>

    <nav class="app-header__nav" aria-label="primary">
      <a routerLink="/posts" routerLinkActive="is-active">{{ 'nav.posts' | transloco }}</a>
    </nav>

    <div class="app-header__actions">
      <app-lang-switcher />
    </div>
  </div>
</header>

<main class="app-main">
  <router-outlet />
</main>

<footer class="app-footer">
  <small>© {{ year() }} — Posts demo</small>
</footer>
