<section class="posts-list">
  <header class="posts-list__header">
    <h1 class="posts-list__title">{{ 'posts.list.title' | transloco }}</h1>
  </header>

  <div class="posts-list__filters">
    <app-posts-search />
    <app-posts-author-filter />
    <app-posts-tag-filter />
  </div>

  @switch (postsResource.status()) {
    @case ('loading') {
      <app-loading-state labelKey="posts.list.loading" testId="posts-loading" />
    }
    @case ('error') {
      <app-error-state labelKey="posts.list.error" testId="posts-error" />
    }
    @case ('resolved') {
      @if (items().length === 0) {
        <app-empty-state labelKey="posts.list.empty" testId="posts-empty" />
      } @else {
        <ul class="posts-list__items" data-testid="posts-items">
          @for (post of items(); track post.id) {
            <li>
              <app-post-list-item [post]="post" />
            </li>
          }
        </ul>
        <p class="posts-list__count" data-testid="posts-count">
          {{ 'posts.list.count' | transloco: { total: total() } }}
        </p>
        <app-posts-pagination />
      }
    }
  }
</section>
