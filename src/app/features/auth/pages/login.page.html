<section class="login">
  <header class="login__header">
    <h1 class="login__title">{{ 'auth.login.title' | transloco }}</h1>
    <p class="login__subtitle">{{ 'auth.login.subtitle' | transloco }}</p>
  </header>

  <form class="login__form" (submit)="onSubmit($event)" novalidate>
    <label class="login__field">
      <span class="login__label">{{ 'auth.login.username' | transloco }}</span>
      <input
        type="text"
        autocomplete="username"
        [formField]="form.name"
        [attr.placeholder]="'auth.login.usernamePlaceholder' | transloco"
      />
      @if (showNameError()) {
        <small class="login__error">
          {{ 'auth.errors.required' | transloco }}
        </small>
      }
    </label>

    <label class="login__field">
      <span class="login__label">{{ 'auth.login.password' | transloco }}</span>
      <input
        type="password"
        autocomplete="current-password"
        [formField]="form.password"
        [attr.placeholder]="'auth.login.passwordPlaceholder' | transloco"
      />
      @if (showPasswordError()) {
        <small class="login__error">
          {{ 'auth.errors.required' | transloco }}
        </small>
      }
    </label>

    @if (errorMessage(); as key) {
      <app-error-state [labelKey]="key" testId="login-error" />
    }

    <button
      type="submit"
      class="login__submit"
      [disabled]="!canSubmit()"
      data-testid="login-submit"
    >
      @if (store.loading()) {
        {{ 'auth.login.submitting' | transloco }}
      } @else {
        {{ 'auth.login.submit' | transloco }}
      }
    </button>
  </form>
</section>
